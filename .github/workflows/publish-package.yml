name: Publish Packages

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohamedosamaai'

      - name: Install dependencies
        run: npm ci

      - name: Build Types & Dist
        run: npm run build

      - name: Publish Ecosystem Master Package
        run: |
          npm publish --access public || echo "Package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
