name: Master Ecosystem CI/CD & Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  type-check:
    name: 🛡️ Strict TypeScript Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero Type Errors (tsc --noEmit)
        run: npm run type-check

  codeql-analysis:
    name: 🔒 CodeQL Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  build-validation:
    name: ⚡ Build & Verification Pipeline
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Diagnostics & Showcase Verification
        run: |
          echo "Executing Master Ecosystem Build Validation..."
          chmod +x ./tools/showcase-generator.sh
          ./tools/showcase-generator.sh

      - name: Verify Documentation Synchronization (Wiki vs Mirror)
        run: |
          git diff --exit-code docs/ || (echo "❌ Error: Documentation is out of sync! Please run 'npm run showcase:generate' locally and commit the synced docs/ directory." && exit 1)
