name: GitHub Profile 3D Contribution Visualizer

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Contribution Graph
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Profile Graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push to Assets Branch
        run: |
          git config user.name "Mohamed Osama"
          git config user.email "im@mohamedosama.me"
          git checkout -B profile-3d-assets
          git add profile-3d-contrib/
          git commit -m "chore(profile): update 3d contribution grid and metrics" || exit 0
          git push -f origin profile-3d-assets
